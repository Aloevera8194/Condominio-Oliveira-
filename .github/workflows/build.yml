name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug)
        run: gradle assembleDebug

      - name: Renomear APK com o número da versão
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Condominio-v${{ github.run_number }}.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Condominio-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/Condominio-v${{ github.run_number }}.apk
